[build-system]
requires = ["uv-build~=0.12.22"]
build-backend = "uv_build"

[project]
name = "minibotcatcher"
version = "1.0.0.post1"
description = "A small Discord bot to catch spam bots."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "thegamecracks" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Communications :: Chat",
    "Topic :: Internet",
    "Typing :: Typed",
]
dependencies = [
    "discord.py>=2.7",
    "python-dotenv>=1.2",
]

[dependency-groups]
dev = ["jishaku>=2.7"]

[project.scripts]
minibotcatcher = "minibotcatcher.__main__:main"

[project.urls]
# https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
Homepage = "https://github.com/thegamecracks/minibotcatcher"
GitHub = "https://github.com/thegamecracks/minibotcatcher"
Issues = "https://github.com/thegamecracks/minibotcatcher/issues"
